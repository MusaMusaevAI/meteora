name: security
# Strix (AI penetration-testing agents, the owner's fork, pinned) reviews the
# whole repository: Mac and iPhone apps, scripts and CI. Manual runs only,
# so the API credits are spent on purpose.
# Needs two repository secrets: STRIX_LLM (model, e.g.
# "anthropic/claude-opus-5-5") and LLM_API_KEY (that provider's key). Without
# them the job only says so and stops.
# The repository is public, and so are run logs and artifacts: the scan prints
# nothing to the log, and the report leaves the runner only encrypted to
# .github/security-report-cert.pem (branch security-reports). The private key
# is held by the owner.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick / standard / deep"
        default: standard
        type: choice
        options: [quick, standard, deep]
      budget:
        description: "Spending limit for this run, USD"
        default: "8"
      focus:
        description: "full = whole repository, MASVS matrix, AI-era threats, hardening; followup = only areas a previous run did not finish"
        default: full
        type: choice
        options: [full, followup]
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: false
jobs:
  strix:
    # Fixed image: the pinned requirements are for its Python 3.12.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      STRIX_TELEMETRY: "0"
      STRIX_COMMIT: f7a32ae62d94872631bc8415073868d02a6ffdaf
      # The agents' tool sandbox, pinned by digest (Strix reads STRIX_IMAGE).
      STRIX_IMAGE: ghcr.io/usestrix/strix-sandbox@sha256:f6906c3114e504fd1a218fcf028d7a0e46851118403a438b63956de6ea7c4331
      SCAN_MODE: ${{ inputs.mode || 'standard' }}
      SCAN_BUDGET: ${{ inputs.budget || '8' }}
      SCAN_INSTRUCTIONS: ${{ inputs.focus == 'followup' && 'docs/security/strix-instructions-followup.md' || 'docs/security/strix-instructions.md' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check secrets
        id: keys
        run: |
          if [ -z "$STRIX_LLM" ] || [ -z "$LLM_API_KEY" ]; then
            echo "::warning title=strix::Add repository secrets STRIX_LLM and LLM_API_KEY to run Strix."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Strix (owner's fork, pinned commit, hash-pinned dependencies)
        if: steps.keys.outputs.ready == 'true'
        run: |
          python3 -m venv /tmp/strix
          # Every package must match a hash in the file; nothing is resolved anew.
          /tmp/strix/bin/pip install --quiet --require-hashes -r .github/strix-requirements.txt
          # Strix itself: the pinned commit of the owner's fork, run from source
          # (no build step, nothing else downloaded).
          git clone --quiet https://github.com/MusaMusaevAI/strix /tmp/strix-src
          git -C /tmp/strix-src checkout --quiet "$STRIX_COMMIT"
          test "$(git -C /tmp/strix-src rev-parse HEAD)" = "$STRIX_COMMIT"
          /tmp/strix/bin/pip check
          /tmp/strix/bin/pip show litellm | head -2
      - name: Sandbox image (pinned by digest)
        if: steps.keys.outputs.ready == 'true'
        run: |
          # The sandbox runs the agents' tools; it never receives the API key.
          docker pull -q "$STRIX_IMAGE"
          echo "$STRIX_IMAGE" > sandbox-image.txt
      - name: Scan
        if: steps.keys.outputs.ready == 'true'
        continue-on-error: true
        run: |
          # Strix keeps its run state (an SQLite database) under ./strix_runs.
          # The repository is mounted read-write into the agents' sandbox, so
          # the state must live outside it: a tool run there once deleted it
          # and crashed the scan.
          mkdir -p /tmp/strix-work && cd /tmp/strix-work
          # The encryption certificate is taken before the agents get write
          # access to the checkout.
          cp "$GITHUB_WORKSPACE/.github/security-report-cert.pem" /tmp/report-cert.pem
          PYTHONPATH=/tmp/strix-src /tmp/strix/bin/python -c 'import sys; sys.argv[0] = "strix"; from strix.interface.main import main; main()' \
            --target "$GITHUB_WORKSPACE" --non-interactive --scan-mode "$SCAN_MODE" --scope-mode full \
            --instruction-file "$GITHUB_WORKSPACE/$SCAN_INSTRUCTIONS" --max-budget-usd "$SCAN_BUDGET" > "$GITHUB_WORKSPACE/strix.log" 2>&1
          echo "Scan finished (exit $?). Output is in the encrypted report only."
      - name: Collect
        if: always() && steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p out-security
          cp strix.log sandbox-image.txt out-security/ 2>/dev/null || true
          [ -d /tmp/strix-work/strix_runs ] && (cd /tmp/strix-work && find strix_runs -type f \( -name '*.md' -o -name '*.json' -o -name '*.txt' \) -size -4M -print0 \
            | xargs -0 -I{} cp --parents {} "$GITHUB_WORKSPACE/out-security/") || true
          # Keys never leave the runner: drop anything that might echo them.
          grep -rlF "$LLM_API_KEY" out-security 2>/dev/null | xargs -r rm -f
          # Encrypted for the owner only; nothing readable leaves the runner.
          tar czf report.tgz out-security
          openssl cms -encrypt -binary -aes256 -in report.tgz -outform DER \
            -out "strix-report-${GITHUB_RUN_NUMBER}.tgz.cms" /tmp/report-cert.pem
          rm -rf out-security report.tgz strix.log /tmp/strix-work
          ls -l "strix-report-${GITHUB_RUN_NUMBER}.tgz.cms"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.keys.outputs.ready == 'true'
        with:
          name: security-report-encrypted
          path: strix-report-*.tgz.cms
          retention-days: 30

  # Separate job, without the API key and without third-party code: only it
  # may write to the repository, and only the encrypted file.
  publish:
    needs: strix
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-report-encrypted
          path: report
      - name: Push to security-reports branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd report
          git init -q -b security-reports
          git -c user.name="meteora-ci" -c user.email="meteora-ci@users.noreply.github.com" add -A
          git -c user.name="meteora-ci" -c user.email="meteora-ci@users.noreply.github.com" commit -qm "encrypted security report, run $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" security-reports
