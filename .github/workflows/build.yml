name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
# Least privilege: the build job can only read. Only the tiny publish job,
# which runs no project code, may write to the repository.
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 80
    outputs:
      status: ${{ steps.summary.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          mkdir -p logs
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] && sudo xcode-select -s "$XC" || true
          { sw_vers; xcodebuild -version; swift --version; } 2>&1 | tee logs/toolchain.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ci-fixtures
          path: ci-fixtures
          persist-credentials: false
      - name: Large fixture
        run: mv ci-fixtures/long-1920.webm /tmp/long-1920.webm && rm -rf ci-fixtures
      - name: Vendor libraries (hash-pinned)
        run: scripts/fetch_vendor.sh 2>&1 | tee logs/vendor.txt
      - name: Russian speech sample for the transcription self-test
        run: |
          R=https://huggingface.co/csukuangfj/sherpa-onnx-nemo-transducer-punct-giga-am-v3-russian-2025-12-16/resolve/main
          curl -fsSL --retry 3 -o /tmp/ru-example.wav "$R/test_wavs/example.wav" || echo "no sample"
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: swift test 2>&1 | tee logs/tests.txt
      # FFmpeg for the isolated converter: built from pinned, verified source
      # (scripts/build_ffmpeg.sh). Restore/save are separate so the cache is
      # saved even when a later step (tests, self-test) fails the job.
      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-7.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: FFmpeg (pinned source, LGPL, minimal)
        run: scripts/build_ffmpeg.sh 2>&1 | tee logs/ffmpeg.txt
      - name: Save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-7.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Build app
        id: app
        run: scripts/build_app.sh 2>&1 | tee logs/build.txt
      - name: Self-test (sandboxed app, real WebKit)
        id: selftest
        continue-on-error: true
        timeout-minutes: 40
        run: scripts/selftest.sh 2>&1 | tee logs/selftest.txt
      - name: DMG
        id: dmg
        run: scripts/make_dmg.sh 2>&1 | tee logs/dmg.txt
      - name: Collect output
        id: summary
        if: always()
        run: |
          scripts/collect_output.sh
          echo "status=tests=${{ steps.tests.outcome }} app=${{ steps.app.outcome }} selftest=${{ steps.selftest.outcome }} dmg=${{ steps.dmg.outcome }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-output
          path: out
          retention-days: 14
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success' || steps.selftest.outcome != 'success'
        run: exit 1

  publish:
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output
          path: out
      - name: Push to build-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ needs.macos.outputs.status }}
        run: |
          cd out
          echo "$GITHUB_SHA" > SOURCE_SHA
          echo "$JOB_STATUS" > STATUS
          git init -q -b build-output
          git -c user.name="meteora-ci" -c user.email="meteora-ci@users.noreply.github.com" add -A
          git -c user.name="meteora-ci" -c user.email="meteora-ci@users.noreply.github.com" commit -qm "build $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-output
